<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173c66"><title>Connecticut Permit Prep</title><style>body{margin:0;background:#edf3fa;color:#172b42;font:16px system-ui,sans-serif}main{max-width:690px;margin:auto;padding:24px 16px}section{background:white;border-radius:18px;padding:24px;margin:16px 0;box-shadow:0 3px 18px #1232}button{display:block;width:100%;padding:15px;text-align:left;border:1px solid #b9c9da;background:white;border-radius:11px;margin:9px 0;font:inherit;cursor:pointer}button.primary{background:#173c66;color:white;text-align:center}button.sel{border:3px solid #2865aa}button:disabled{cursor:default}small{color:#60768e}.bar{background:#d9e4ef;height:8px;border-radius:8px}.bar div{height:8px;background:#2874bc;border-radius:8px}h1{margin-bottom:0}h2{line-height:1.4}.ok{color:#087642}.bad{color:#b52731}</style><main><h1>Connecticut Permit Prep</h1><small>Independent practice • Not affiliated with Connecticut DMV</small><div id="app"></div><p><small>For official study material, use the <a href="https://portal.ct.gov/dmv/licenses-permits-ids/ct-drivers-manuals">Connecticut Driver's Manual</a>. These are original practice questions, not DMV exam questions.</small></p></main><script>

["At a four-way stop, two drivers arrive simultaneously. Who usually goes first?","The driver on the right","The driver on the left","The faster vehicle","The larger vehicle","Drivers arriving together generally yield to the vehicle on their right."],
["An eight-sided red sign means:","Stop","Yield","Do not enter","No parking","The octagonal shape identifies a stop sign."],
["An inverted red-and-white triangular sign means:","Yield","Stop","School crossing","Railroad crossing","The inverted triangle identifies a yield sign."],

let mode='exam',set=[],pos=0,answers={},done=false;const app=document.getElementById('app');const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const button=(label,fn,cls='')=>{let b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;return b};function start(m){mode=m;set=shuffle(data).slice(0,25).map(r=>({r,opts:shuffle([0,1,2,3])}));pos=0;answers={};done=false;draw()}function home(){app.innerHTML='<section><h2>Practice for the real exam</h2><p>25 randomized questions • 20 correct to pass • 80% required</p><p>50 original starter questions. Exam mode grades at the end; study mode explains answers immediately.</p><div id="actions"></div></section>';let a=document.getElementById('actions');a.append(button('Start Exam',()=>start('exam'),'primary'),button('Study Mode',()=>start('study')))}function draw(){if(done)return results();let q=set[pos],a=answers[pos];app.innerHTML='<section><small>'+(mode==='exam'?'EXAM':'STUDY')+' • QUESTION '+(pos+1)+'/25</small><div class="bar"><div style="width:'+((pos+1)*4)+'%"></div></div><h2></h2><div id="options"></div><div id="feedback"></div><div id="nav"></div></section>';app.querySelector('h2').textContent=q.r[0];let o=document.getElementById('options');q.opts.forEach((idx,i)=>{let b=button('ABCD'[i]+'. '+q.r[idx+1],()=>{answers[pos]=idx;draw()},a===idx?'sel':'');if(mode==='study'&&a!==undefined)b.disabled=true;o.append(b)});if(mode==='study'&&a!==undefined){let d=document.getElementById('feedback');d.innerHTML='<p class="'+(a===0?'ok':'bad')+'"><b>'+(a===0?'Correct':'Not quite')+'</b></p>';let p=document.createElement('p');p.textContent=q.r[5];d.append(p)}let n=document.getElementById('nav');if(pos)n.append(button('← Previous',()=>{pos--;draw()}));if(pos<24)n.append(button('Next →',()=>{pos++;draw()},'primary'));else n.append(button('Submit exam',()=>{if(Object.keys(answers).length<25&&!confirm('Submit with unanswered questions?'))return;done=true;results()},'primary'))}function results(){let score=set.filter((q,i)=>answers[i]===0).length;let h=JSON.parse(localStorage.getItem('ctpermit-scores')||'[]');h.unshift({date:new Date().toLocaleDateString(),score});localStorage.setItem('ctpermit-scores',JSON.stringify(h.slice(0,50)));app.innerHTML='<section><h2>'+score+'/25 — '+(score>=20?'PASS':'KEEP PRACTICING')+'</h2><p>'+score*4+'% • 20 correct required</p><div id="actions"></div></section><section><h2>Review all answers</h2><div id="review"></div></section>';let a=document.getElementById('actions');a.append(button('Another exam',()=>start('exam'),'primary'),button('Study mode',()=>start('study')),button('Home',home));let r=document.getElementById('review');set.forEach((q,i)=>{let d=document.createElement('details'),s=document.createElement('summary');s.textContent=(answers[i]===0?'✓ ':'✗ ')+(i+1)+'. '+q.r[0];d.append(s);let p=document.createElement('p');p.textContent='Your answer: '+(answers[i]===undefined?'Unanswered':q.r[answers[i]+1])+' | Correct: '+q.r[1]+'. '+q.r[5];d.append(p);r.append(d)})}home();
</script></html>
